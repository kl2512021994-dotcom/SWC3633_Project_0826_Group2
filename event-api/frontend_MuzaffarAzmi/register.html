<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Evently — Register</title>
    <link rel="stylesheet" href="app.css">
</head>

<body>
    <div class="login-page">
        <section class="hero">
            <div class="brand">EVENT<span>LY</span></div>
            <h1>Your next event<br>starts here.</h1>
            <p style="color:#ddd6fe">Create a customer account and start booking.</p>
        </section>
        <main class="auth">
            <div class="auth-card">
                <h2>Create account</h2>
                <p class="muted">Customer registration</p>
                <div id="notice" class="notice"></div>
                <form id="reg" class="form">
                    <div class="field"><label>Full name</label><input id="name" required></div>
                    <div class="field"><label>Email</label><input id="email" type="email" required></div>
                    <div class="field"><label>Password</label><input id="password" type="password" minlength="4"
                            required></div><button class="btn primary">Create account</button>
                </form>
                <div class="link">Already registered? <a href="login.html">Sign in</a></div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
    <script>$('#reg').onsubmit = async e => {e.preventDefault(); try {await api('/users', {method: 'POST', body: JSON.stringify({full_name: $('#name').value.trim(), email: $('#email').value.trim(), password: $('#password').value, role: 'Customer'})}); msg('Account created. Redirecting…'); setTimeout(() => location = 'login.html', 900)} catch (x) {msg(x.message, false)} };</script>
</body>

</html>
